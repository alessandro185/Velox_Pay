<div class="metrics">
  <article class="metric-card green">
    <div class="metric-icon">R$</div>
    <div class="metric-label">Faturamento</div>
    <div class="metric-value" id="repFaturamento">R$ 0,00</div>
    <div class="metric-sub">total aprovado</div>
  </article>
  <article class="metric-card blue">
    <div class="metric-icon">TX</div>
    <div class="metric-label">Transações</div>
    <div class="metric-value" id="repTransacoes">0</div>
    <div class="metric-sub">volume total</div>
  </article>
  <article class="metric-card purple">
    <div class="metric-icon">%</div>
    <div class="metric-label">Ticket médio</div>
    <div class="metric-value" id="repTicket">R$ 0,00</div>
    <div class="metric-sub">por pagamento</div>
  </article>
  <article class="metric-card amber">
    <div class="metric-icon">CSV</div>
    <div class="metric-label">Exportações</div>
    <div class="metric-value" id="repExportacoes">0</div>
    <div class="metric-sub">relatórios gerados</div>
  </article>
</div>

<div class="section-grid">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Filtros do relatório</div>
        <div class="card-subtitle">Defina o período, método e status desejado</div>
      </div>
      <span class="pill pill-purple">Analytics</span>
    </div>
    <div class="form">
      <div class="form-grid">
        <label class="form-row">
          <span class="form-label">Data inicial</span>
          <input class="input" type="date" value="2026-05-01">
        </label>
        <label class="form-row">
          <span class="form-label">Data final</span>
          <input class="input" type="date" value="2026-05-21">
        </label>
      </div>
      <div class="form-grid">
        <label class="form-row">
          <span class="form-label">Método</span>
          <select class="select">
            <option>Todos</option>
            <option>Pix</option>
            <option>Cartão</option>
            <option>Dinheiro</option>
          </select>
        </label>
        <label class="form-row">
          <span class="form-label">Status</span>
          <select class="select">
            <option>Todos</option>
            <option>Aprovado</option>
            <option>Pendente</option>
            <option>Recusado</option>
          </select>
        </label>
      </div>
      <div class="report-actions">
        <button class="button" type="button" data-action="export-report">Exportar CSV</button>
        <button class="button secondary" type="button" data-action="export-report">Exportar PDF</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-header">
      <div class="card-title">Faturamento por período</div>
      <span class="pill pill-green">+18,4%</span>
    </div>
    <div class="bar-list">
      <div class="bar-row">
        <span class="bar-label">Semana 1</span>
        <div class="bar-track"><div class="bar-fill" style="width:72%;background:var(--green)"></div></div>
        <span class="bar-value">72%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Semana 2</span>
        <div class="bar-track"><div class="bar-fill" style="width:54%;background:var(--blue)"></div></div>
        <span class="bar-value">54%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Semana 3</span>
        <div class="bar-track"><div class="bar-fill" style="width:88%;background:var(--purple)"></div></div>
        <span class="bar-value">88%</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Semana 4</span>
        <div class="bar-track"><div class="bar-fill" style="width:63%;background:var(--amber)"></div></div>
        <span class="bar-value">63%</span>
      </div>
    </div>
  </section>
</div>
